<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUNA — ювелирный магазин (концепт)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ec; --fg: #1a1a1a; --muted: #77736c; --line: rgba(26, 26, 26, .12);
    --card: #ebe6dc; --gold: #b8975a; --serif: "Cormorant Garamond", Georgia, serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  .caps { font-size: .7rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .serif { font-family: var(--serif); font-weight: 500; letter-spacing: -.01em; }

  /* Шапка */
  .top { position: sticky; top: 0; z-index: 20; background: rgba(245, 242, 236, .92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top .wrap { height: 56px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; cursor: pointer; padding: 0; }
  .burger { display: grid; gap: 5px; width: 20px; }
  .burger i { display: block; height: 1.5px; background: var(--fg); }
  .burger i:last-child { width: 70%; }
  .logo { font-family: var(--serif); font-size: 1.35rem; letter-spacing: .45em; padding-left: .45em; }
  .cart-link { justify-self: end; display: flex; align-items: center; gap: .4rem; font-size: .85rem; }
  .cart-count { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--fg); color: var(--bg); font-size: .72rem; display: grid; place-items: center; }

  /* Меню */
  .drawer { position: fixed; inset: 0; z-index: 40; background: rgba(26, 26, 26, .35); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .drawer.open { opacity: 1; pointer-events: auto; }
  .drawer__panel { position: absolute; inset: 0 auto 0 0; width: min(82vw, 340px); background: var(--bg); padding: 20px 24px; transform: translateX(-100%); transition: transform .3s cubic-bezier(.2, .7, .2, 1); display: flex; flex-direction: column; }
  .drawer.open .drawer__panel { transform: none; }
  .drawer__panel nav { display: grid; margin-top: 24px; }
  .drawer__panel nav a { font-family: var(--serif); font-size: 1.7rem; padding: .35rem 0; border-bottom: 1px solid var(--line); }
  .drawer__close { align-self: flex-end; font-size: 1.6rem; }

  /* Кнопки */
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 50px; padding: 0 28px; border: 1px solid var(--fg); background: var(--fg); color: var(--bg); font-size: .78rem; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; transition: opacity .2s; }
  .btn:active { opacity: .8; }
  .btn--ghost { background: none; color: var(--fg); }
  .btn--wide { width: 100%; }
  .link { border-bottom: 1px solid var(--fg); padding-bottom: 2px; font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; }

  /* Главная */
  .hero { display: grid; gap: 22px; padding: 16px 0 40px; }
  .hero__img { aspect-ratio: 4 / 3; overflow: hidden; background: var(--card); }
  .hero__img img { width: 100%; height: 100%; object-fit: cover; }
  .hero h1 { font-size: clamp(2.6rem, 11vw, 4.4rem); line-height: 1; margin: .4rem 0 .7rem; }
  .hero p { color: var(--muted); margin: 0 0 1.4rem; max-width: 26rem; }
  .sec { padding: 28px 0; border-top: 1px solid var(--line); }
  .sec__head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
  .sec__head h2 { font-size: 2rem; margin: 0; }
  .rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
  .rail::after { content: ""; flex: 0 0 4px; }
  .rail::-webkit-scrollbar { display: none; }
  .rail .pcard { flex: 0 0 62%; max-width: 260px; scroll-snap-align: start; }
  .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cat { position: relative; aspect-ratio: 1; overflow: hidden; background: var(--card); }
  .cat img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
  .cat::after { content: ""; position: absolute; inset: 45% 0 0; background: linear-gradient(transparent, rgba(0, 0, 0, .42)); }
  .cat span { z-index: 1; position: absolute; left: 12px; bottom: 10px; font-family: var(--serif); font-size: 1.5rem; color: #fff; text-shadow: 0 1px 12px rgba(0, 0, 0, .35); }
  .quote { text-align: center; padding: 48px 0; }
  .quote blockquote { margin: 0 auto; max-width: 30rem; font-family: var(--serif); font-style: italic; font-size: clamp(1.7rem, 7vw, 2.4rem); line-height: 1.2; }
  .perks { display: grid; gap: 14px; padding: 28px 0 36px; border-top: 1px solid var(--line); }
  .perks b { display: block; font-weight: 600; }
  .perks span { color: var(--muted); font-size: .9rem; }

  /* Карточка товара в списке */
  .pcard { display: block; }
  .pcard__img { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--card); }
  .pcard__img img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
  .pcard__new { position: absolute; top: 8px; left: 8px; padding: 2px 8px; background: var(--bg); font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; }
  .pcard__name { font-family: var(--serif); font-size: 1.2rem; margin-top: 10px; line-height: 1.2; }
  .pcard__price { color: var(--muted); font-size: .82rem; margin-top: 2px; }
  @media (hover: hover) { .pcard:hover img, .cat:hover img { transform: scale(1.04); } }

  /* Каталог */
  .page-title { font-size: clamp(2.4rem, 10vw, 3.6rem); margin: 20px 0 14px; line-height: 1; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; display: inline-flex; align-items: center; height: 36px; padding: 0 16px; border: 1px solid var(--line); background: none; border-radius: 18px; font-size: .85rem; cursor: pointer; white-space: nowrap; }
  .chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin: 16px 0; color: var(--muted); font-size: .85rem; }
  .toolbar select { border: 0; background: none; font-size: .85rem; padding: 4px 0; cursor: pointer; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 12px; padding-bottom: 40px; }

  /* Товар */
  .back { display: inline-block; margin: 16px 0; font-size: .85rem; color: var(--muted); }
  .product { display: grid; gap: 22px; padding-bottom: 32px; }
  .product__img { aspect-ratio: 4 / 5; overflow: hidden; background: var(--card); }
  .product__img img { width: 100%; height: 100%; object-fit: cover; }
  .product h1 { font-size: 2.3rem; line-height: 1.05; margin: .3rem 0 .4rem; }
  .product__price { font-size: 1.15rem; }
  .product__mat { color: var(--muted); font-size: .9rem; margin: .3rem 0 1.2rem; }
  .opt-label { display: flex; justify-content: space-between; font-size: .85rem; margin-bottom: 8px; }
  .opt-label em { color: #b0473a; font-style: normal; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .opt { min-width: 52px; height: 44px; padding: 0 14px; border: 1px solid var(--line); background: none; cursor: pointer; }
  .opt.on { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
  details { border-top: 1px solid var(--line); }
  details:last-of-type { border-bottom: 1px solid var(--line); }
  summary { list-style: none; display: flex; justify-content: space-between; padding: 14px 0; cursor: pointer; font-size: .9rem; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font-size: 1.2rem; line-height: 1; }
  details[open] summary::after { content: "−"; }
  details p { margin: 0 0 14px; color: var(--muted); font-size: .9rem; }

  /* Корзина */
  .line-item { display: grid; grid-template-columns: 76px 1fr auto; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .line-item img { width: 76px; height: 95px; object-fit: cover; background: var(--card); }
  .line-item b { display: block; font-family: var(--serif); font-size: 1.15rem; font-weight: 500; line-height: 1.2; }
  .line-item small { color: var(--muted); font-size: .8rem; }
  .qty { display: inline-flex; align-items: center; border: 1px solid var(--line); margin-top: 10px; }
  .qty button { width: 34px; height: 32px; border: 0; background: none; cursor: pointer; font-size: 1.05rem; }
  .qty span { min-width: 24px; text-align: center; font-size: .9rem; }
  .line-item__right { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; }
  .remove { border: 0; background: none; color: var(--muted); font-size: .8rem; cursor: pointer; padding: 0; text-decoration: underline; }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 0; font-size: 1.05rem; }
  .total b { font-size: 1.35rem; font-weight: 600; }
  .form { display: grid; gap: 12px; padding-bottom: 40px; }
  .form label { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); }
  .form input { height: 48px; padding: 0 14px; border: 1px solid var(--line); background: #fff; font-size: 16px; color: var(--fg); }
  .form input:focus { outline: none; border-color: var(--fg); }
  .note { color: var(--muted); font-size: .8rem; text-align: center; margin: 4px 0 0; }
  .empty { text-align: center; padding: 60px 0; }
  .empty p { color: var(--muted); }

  footer { border-top: 1px solid var(--line); padding: 22px 0 calc(28px + env(safe-area-inset-bottom)); color: var(--muted); font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; }
  footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 50; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: .3s; background: var(--fg); color: var(--bg); padding: 12px 18px; font-size: .85rem; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast a { text-decoration: underline; margin-left: 10px; }

  main { min-height: 70vh; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; } }

  @media (min-width: 769px) {
    .wrap { padding: 0 32px; }
    .hero { grid-template-columns: 1.2fr 1fr; align-items: center; gap: 48px; padding: 32px 0 56px; }
    .rail { margin: 0; padding: 0; overflow: visible; display: grid; grid-template-columns: repeat(3, 1fr); }
    .rail .pcard { max-width: none; }
    .cats { grid-template-columns: repeat(4, 1fr); }
    .perks { grid-template-columns: repeat(3, 1fr); }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 32px 20px; }
    .chips { margin: 0; padding: 0; }
    .product { grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
    .cart-page { max-width: 640px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <button class="icon-btn" type="button" data-menu aria-label="Меню"><span class="burger"><i></i><i></i><i></i></span></button>
    <a class="logo" href="#/">LUNA</a>
    <a class="cart-link" href="#/cart" aria-label="Корзина">Корзина <span class="cart-count" data-count>0</span></a>
  </div>
</header>

<div class="drawer" data-drawer>
  <div class="drawer__panel">
    <button class="icon-btn drawer__close" type="button" data-menu-close aria-label="Закрыть меню">×</button>
    <nav>
      <a href="#/">Главная</a>
      <a href="#/catalog">Каталог</a>
      <a href="#/catalog/rings">Кольца</a>
      <a href="#/catalog/earrings">Серьги</a>
      <a href="#/catalog/necklaces">Колье</a>
      <a href="#/catalog/bracelets">Браслеты</a>
      <a href="#/cart">Корзина</a>
    </nav>
  </div>
</div>

<main id="app"></main>

<footer>
  <div class="wrap"><span>Доставка · Уход · Гарантия</span><span>© LUNA 2026 · концепт</span></div>
</footer>

<div class="toast" data-toast role="status"></div>

<script>
(function () {
  var CATS = { rings: "Кольца", earrings: "Серьги", necklaces: "Колье", bracelets: "Браслеты" };
  var P = [
    { id: "svet", name: "Кольцо «Свет»", cat: "rings", price: 64000, img: "img/ring-svet.jpg", isNew: true,
      mat: "18K золото, бриллиант 0,3 кт", desc: "Тонкая шинка и один камень. Кольцо, которое носят каждый день и не снимают.",
      opt: { label: "Размер", values: ["15", "16", "17", "18"] } },
    { id: "kupol", name: "Серьги «Купол»", cat: "earrings", price: 38000, img: "img/earrings-kupol.jpg", isNew: true,
      mat: "18K розовое золото", desc: "Объёмные серьги-подвески с рельефом. Лёгкие, несмотря на размер." },
    { id: "nit", name: "Колье «Нить»", cat: "necklaces", price: 52000, img: "img/necklace-nit.jpg", isNew: true,
      mat: "18K золото", desc: "Тонкая цепь с подвеской, которая ложится точно по ключицам.",
      opt: { label: "Длина", values: ["40 см", "45 см"] } },
    { id: "orbita", name: "Браслет «Орбита»", cat: "bracelets", price: 46000, img: "img/bracelet-orbita.jpg",
      mat: "18K золото", desc: "Жёсткий браслет с гравировкой по краю. Сочетается с часами.",
      opt: { label: "Размер", values: ["S", "M"] } },
    { id: "gran", name: "Кольцо «Грань»", cat: "rings", price: 42000, img: "img/ring-gran.jpg",
      mat: "18K золото, фианиты", desc: "Кольцо с камнями, собранными в цветок. Подходит для набора с «Светом».",
      opt: { label: "Размер", values: ["15", "16", "17", "18"] } },
    { id: "otr", name: "Колье «Отражение»", cat: "necklaces", price: 47000, img: "img/necklace-otrazhenie.jpg",
      mat: "18K золото", desc: "Длинная цепь мелкого плетения. Можно носить в два оборота.",
      opt: { label: "Длина", values: ["50 см", "60 см"] } }
  ];
  var byId = function (id) { return P.filter(function (p) { return p.id === id; })[0]; };
  var rub = function (n) { return n.toLocaleString("ru-RU") + " ₽"; };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };

  /* Корзина: хранится в sessionStorage, если он доступен */
  var cart = [];
  try { cart = JSON.parse(sessionStorage.getItem("luna-cart")) || []; } catch (e) {}
  function saveCart() {
    try { sessionStorage.setItem("luna-cart", JSON.stringify(cart)); } catch (e) {}
    var n = cart.reduce(function (s, i) { return s + i.qty; }, 0);
    document.querySelector("[data-count]").textContent = n;
  }

  var app = document.getElementById("app");
  var toastEl = document.querySelector("[data-toast]"), toastTimer;
  function toast(html) {
    toastEl.innerHTML = html; toastEl.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
  }

  function card(p) {
    return '<a class="pcard" href="#/product/' + p.id + '"><div class="pcard__img"><img src="' + p.img + '" alt="' + esc(p.name) + '" loading="lazy">' +
      (p.isNew ? '<span class="pcard__new">Новинка</span>' : "") + '</div>' +
      '<div class="pcard__name">' + esc(p.name) + '</div><div class="pcard__price">' + rub(p.price) + '</div></a>';
  }

  /* ---------- Страницы ---------- */
  function home() {
    var cats = Object.keys(CATS).map(function (k) {
      var p = P.filter(function (x) { return x.cat === k; })[0];
      return '<a class="cat" href="#/catalog/' + k + '"><img src="' + p.img + '" alt="" loading="lazy"><span>' + CATS[k] + '</span></a>';
    }).join("");
    return '<div class="wrap">' +
      '<section class="hero"><div class="hero__img"><img src="img/hero.jpg" alt="Кольцо «Свет» на светлой ткани"></div>' +
        '<div><div class="caps">Коллекция 2026</div><h1 class="serif">Тонкие линии</h1>' +
        '<p>Украшения из золота, которые хочется носить каждый день, а не только по праздникам.</p>' +
        '<a class="btn" href="#/catalog">Смотреть каталог</a></div></section>' +
      '<section class="sec"><div class="sec__head"><h2 class="serif">Новинки</h2><a class="link" href="#/catalog">Все</a></div>' +
        '<div class="rail">' + P.filter(function (p) { return p.isNew; }).map(card).join("") + '</div></section>' +
      '<section class="sec"><div class="sec__head"><h2 class="serif">Категории</h2></div><div class="cats">' + cats + '</div></section>' +
      '<section class="quote"><div class="caps">О бренде</div><blockquote>«Украшение должно жить дольше моды»</blockquote></section>' +
      '<section class="perks"><div><b>Доставка</b><span>Курьером по городу или в пункт выдачи</span></div>' +
        '<div><b>Примерка</b><span>Можно примерить перед оплатой</span></div>' +
        '<div><b>Уход</b><span>Чистка украшений в мастерской бренда</span></div></section>' +
    '</div>';
  }

  var sortMode = "default";
  function catalog(cat) {
    var list = P.filter(function (p) { return !cat || p.cat === cat; }).slice();
    if (sortMode === "asc") list.sort(function (a, b) { return a.price - b.price; });
    if (sortMode === "desc") list.sort(function (a, b) { return b.price - a.price; });
    var chips = '<a class="chip' + (!cat ? " on" : "") + '" href="#/catalog">Все</a>' + Object.keys(CATS).map(function (k) {
      return '<a class="chip' + (cat === k ? " on" : "") + '" href="#/catalog/' + k + '">' + CATS[k] + '</a>';
    }).join("");
    var n = list.length, word = n === 1 ? "изделие" : (n < 5 ? "изделия" : "изделий");
    return '<div class="wrap"><h1 class="page-title serif">' + (cat ? CATS[cat] : "Каталог") + '</h1>' +
      '<div class="chips">' + chips + '</div>' +
      '<div class="toolbar"><span>' + n + ' ' + word + '</span><label>Сортировка: <select data-sort>' +
        '<option value="default"' + (sortMode === "default" ? " selected" : "") + '>по умолчанию</option>' +
        '<option value="asc"' + (sortMode === "asc" ? " selected" : "") + '>сначала дешевле</option>' +
        '<option value="desc"' + (sortMode === "desc" ? " selected" : "") + '>сначала дороже</option></select></label></div>' +
      '<div class="grid">' + list.map(card).join("") + '</div></div>';
  }

  function product(id) {
    var p = byId(id);
    if (!p) return notFound();
    var more = P.filter(function (x) { return x.id !== p.id; }).slice(0, 2);
    var opts = p.opt ? '<div class="opt-label"><span>' + p.opt.label + '</span><em data-opt-err hidden>Выберите ' + p.opt.label.toLowerCase() + '</em></div>' +
      '<div class="opts">' + p.opt.values.map(function (v) { return '<button class="opt" type="button" data-opt="' + esc(v) + '">' + esc(v) + '</button>'; }).join("") + '</div>' : "";
    return '<div class="wrap"><a class="back" href="#/catalog/' + p.cat + '">← ' + CATS[p.cat] + '</a>' +
      '<div class="product"><div class="product__img"><img src="' + p.img + '" alt="' + esc(p.name) + '"></div>' +
        '<div><div class="caps">' + CATS[p.cat] + '</div><h1 class="serif">' + esc(p.name) + '</h1>' +
        '<div class="product__price">' + rub(p.price) + '</div><div class="product__mat">' + esc(p.mat) + '</div>' +
        opts + '<button class="btn btn--wide" type="button" data-add="' + p.id + '">Добавить в корзину</button>' +
        '<div style="margin-top:24px"><details open><summary>Описание</summary><p>' + esc(p.desc) + '</p></details>' +
        '<details><summary>Доставка и примерка</summary><p>Курьером по городу или в пункт выдачи. Украшение можно примерить перед оплатой.</p></details>' +
        '<details><summary>Уход</summary><p>Храните отдельно от других украшений, снимайте перед душем и спортом.</p></details></div></div></div>' +
      '<section class="sec"><div class="sec__head"><h2 class="serif">С этим носят</h2></div><div class="grid" style="padding-bottom:12px">' + more.map(card).join("") + '</div></section></div>';
  }

  function cartPage() {
    if (!cart.length) return '<div class="wrap empty"><h1 class="page-title serif">Корзина пуста</h1><p>Загляните в каталог — там новинки сезона.</p><a class="btn" href="#/catalog">В каталог</a></div>';
    var total = 0;
    var rows = cart.map(function (it, i) {
      var p = byId(it.id); total += p.price * it.qty;
      return '<div class="line-item"><img src="' + p.img + '" alt=""><div><b>' + esc(p.name) + '</b><small>' + (it.opt ? esc(p.opt.label + ": " + it.opt) : esc(p.mat)) + '</small><br>' +
        '<div class="qty"><button type="button" data-dec="' + i + '" aria-label="Меньше">−</button><span>' + it.qty + '</span><button type="button" data-inc="' + i + '" aria-label="Больше">+</button></div></div>' +
        '<div class="line-item__right"><span>' + rub(p.price * it.qty) + '</span><button class="remove" type="button" data-del="' + i + '">Удалить</button></div></div>';
    }).join("");
    return '<div class="wrap cart-page"><h1 class="page-title serif">Корзина</h1>' + rows +
      '<div class="total"><span>Итого</span><b>' + rub(total) + '</b></div>' +
      '<form class="form" data-checkout novalidate><div class="caps" style="margin-top:8px">Оформление</div>' +
        '<label>Имя<input name="name" autocomplete="name" required></label>' +
        '<label>Телефон<input name="phone" type="tel" autocomplete="tel" inputmode="tel" required></label>' +
        '<button class="btn btn--wide" type="submit">Оформить заказ</button>' +
        '<p class="note">Это демонстрационный магазин: заказ никуда не отправляется.</p></form></div>';
  }

  function done(name) {
    return '<div class="wrap empty"><div class="caps">Заказ оформлен</div><h1 class="page-title serif">Спасибо' + (name ? ", " + esc(name) : "") + '!</h1>' +
      '<p>В настоящем магазине здесь пришло бы подтверждение заказа. Это демо, поэтому ничего не отправлено.</p><a class="btn btn--ghost" href="#/catalog">Вернуться в каталог</a></div>';
  }
  function notFound() { return '<div class="wrap empty"><h1 class="page-title serif">Страница не найдена</h1><a class="btn" href="#/">На главную</a></div>'; }

  /* ---------- Роутер ---------- */
  var lastName = "";
  function route() {
    var h = (location.hash || "#/").slice(2).split("/");
    var html;
    if (!h[0]) html = home();
    else if (h[0] === "catalog") html = catalog(CATS[h[1]] ? h[1] : "");
    else if (h[0] === "product") html = product(h[1]);
    else if (h[0] === "cart") html = cartPage();
    else if (h[0] === "done") html = done(lastName);
    else html = notFound();
    app.innerHTML = html;
    app.style.animation = "none"; void app.offsetWidth; app.style.animation = "";
    window.scrollTo(0, 0);
    closeMenu();
  }
  window.addEventListener("hashchange", route);

  /* ---------- События ---------- */
  var chosen = null;
  app.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    if (t.hasAttribute("data-opt")) {
      chosen = t.getAttribute("data-opt");
      app.querySelectorAll("[data-opt]").forEach(function (b) { b.classList.toggle("on", b === t); });
      var err = app.querySelector("[data-opt-err]"); if (err) err.hidden = true;
    } else if (t.hasAttribute("data-add")) {
      var p = byId(t.getAttribute("data-add"));
      if (p.opt && !chosen) { app.querySelector("[data-opt-err]").hidden = false; return; }
      var same = cart.filter(function (i) { return i.id === p.id && i.opt === (p.opt ? chosen : null); })[0];
      if (same) same.qty++; else cart.push({ id: p.id, opt: p.opt ? chosen : null, qty: 1 });
      saveCart();
      toast("Добавлено в корзину<a href='#/cart'>Открыть</a>");
    } else if (t.hasAttribute("data-inc")) { cart[+t.getAttribute("data-inc")].qty++; saveCart(); route(); }
    else if (t.hasAttribute("data-dec")) {
      var it = cart[+t.getAttribute("data-dec")]; it.qty--; if (!it.qty) cart.splice(cart.indexOf(it), 1); saveCart(); route();
    } else if (t.hasAttribute("data-del")) { cart.splice(+t.getAttribute("data-del"), 1); saveCart(); route(); }
  });
  app.addEventListener("change", function (e) {
    if (e.target.matches("[data-sort]")) { sortMode = e.target.value; var y = window.scrollY; route(); window.scrollTo(0, y); }
  });
  app.addEventListener("submit", function (e) {
    if (!e.target.matches("[data-checkout]")) return;
    e.preventDefault();
    var f = e.target, ok = true;
    ["name", "phone"].forEach(function (n) {
      var inp = f.elements[n], bad = !inp.value.trim() || (n === "phone" && inp.value.replace(/\D/g, "").length < 10);
      inp.style.borderColor = bad ? "#b0473a" : ""; if (bad) ok = false;
    });
    if (!ok) return;
    lastName = f.elements.name.value.trim();
    cart = []; saveCart(); location.hash = "#/done";
  });
  window.addEventListener("hashchange", function () { chosen = null; });

  /* Меню */
  var drawer = document.querySelector("[data-drawer]");
  function closeMenu() { drawer.classList.remove("open"); }
  document.querySelector("[data-menu]").addEventListener("click", function () { drawer.classList.add("open"); });
  document.querySelector("[data-menu-close]").addEventListener("click", closeMenu);
  drawer.addEventListener("click", function (e) { if (e.target === drawer || e.target.closest("a")) closeMenu(); });

  saveCart();
  route();
})();
</script>
</body>
</html>
